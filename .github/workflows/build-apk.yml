
name: Build KOTA KITA APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract game source
        run: |
          unzip -o KOTA_KITA_SOURCE.zip
          ls -la KOTA_KITA_SOURCE
          ls -la KOTA_KITA_SOURCE/android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          cd KOTA_KITA_SOURCE/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KOTA-KITA-APK
          path: KOTA_KITA_SOURCE/android/app/build/outputs/apk/debug/app-debug.apk
